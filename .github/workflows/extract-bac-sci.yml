name: Extract scientific baccalaureate textbooks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract-bac-sci.py'
      - '.github/workflows/extract-bac-sci.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --user PyMuPDF
      - name: Extract actual textbook metadata and contents
        run: python3 scripts/extract-bac-sci.py
      - name: Publish extracted textbook references
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/bac-sci-extracted
          if ! git diff --cached --quiet; then
            git commit -m 'Extract scientific baccalaureate PDF source references'
            git pull --rebase
            git push
          fi
      - name: Upload PDF extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bac-sci-source-extraction
          path: data/bac-sci-extracted/
