name: Deploy Abu Shreek to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static site
        run: node scripts/prepare-mobile.mjs
      - name: Verify converted textbook images
        run: |
          if [ -f www/book-pages/9-National/001.webp ]; then
            echo 'National textbook image included in site artifact'
            ls -lh www/book-pages/9-National/001.webp
          else
            echo 'National textbook image is not yet in the published branch'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
