name: Extract Philosophy Contents
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract-philosophy-toc.py'
      - 'book-pages/bac-lit-philosophy-1/**'
      - 'book-pages/bac-lit-philosophy-2/**'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Extract original contents candidates
        run: python3 scripts/extract-philosophy-toc.py
      - name: Save OCR drafts to repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/toc-candidates/bac-lit-philosophy-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Store unverified philosophy OCR contents drafts"
            git push
          fi
      - name: Upload drafts for verification
        uses: actions/upload-artifact@v4
        with:
          name: philosophy-contents-unverified
          path: data/toc-candidates/bac-lit-philosophy-*.json
          retention-days: 30
