name: Test Arabic book renderer
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-arabic-rendering.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y mupdf-tools webp
      - run: |
          curl -fL https://github.com/ahmadaljarad/abu-shreek/releases/download/books-v1/bac-sci-biology.pdf -o /tmp/book.pdf
          mkdir -p book-render-tests/biology
          for p in 1 2 3 5 10; do
            mutool draw -q -F png -w 1000 -o /tmp/test.png /tmp/book.pdf "$p"
            cwebp -quiet -q 85 /tmp/test.png -o "book-render-tests/biology/mupdf-$p.webp"
          done
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add book-render-tests
          git diff --cached --quiet || (git commit -m 'Test alternate Arabic renderer' && git pull --rebase && git push)
