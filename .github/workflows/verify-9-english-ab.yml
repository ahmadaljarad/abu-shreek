name: Verify ninth English workbook original pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify-9-english-ab.py'
      - '.github/workflows/verify-9-english-ab.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            book-pages/9-English-AB
            data/verified-toc/9-English-AB.pdf.json
            data/toc-source-evidence/9-English-AB.pdf.json
            data/toc-candidates
            scripts/verify-9-english-ab.py
          sparse-checkout-cone-mode: false
      - name: Install original PDF and image comparison tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install --quiet PyMuPDF Pillow
      - name: Check every lesson heading and page-image correspondence
        run: python scripts/verify-9-english-ab.py
      - name: Save evidence report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/toc-candidates/9-English-AB-full-check.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record original English workbook heading and image-page checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
