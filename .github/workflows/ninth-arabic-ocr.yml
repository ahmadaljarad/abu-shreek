name: Arabic textbook OCR
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ninth-arabic-ocr.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
      - name: Extract pages 101-200
        run: python3 scripts/extract_ninth_arabic_101_200.py
      - name: Save extracted text to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ninth-extracted/9-Arabic-pages-101-200.json
          if ! git diff --cached --quiet; then
            git commit -m "Add unreviewed OCR text for Arabic textbook pages 101-200"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-ocr-pages-101-200
          path: data/ninth-extracted/9-Arabic-pages-101-200.json
