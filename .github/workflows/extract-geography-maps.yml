name: تثبيت خرائط الجغرافيا الأصلية
on:
  push:
    paths:
      - '.github/workflows/extract-geography-maps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils python3-pil
          command -v pdfinfo
          command -v pdftoppm
      - name: Download original geography textbook and export pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/geography-maps
          curl -fL --retry 3 --retry-delay 2 'https://github.com/ahmadaljarad/abu-shreek/releases/download/books-v1/bac-lit-geography.pdf' -o /tmp/geography.pdf
          pdfinfo /tmp/geography.pdf > /tmp/geography-info.txt
          head -18 /tmp/geography-info.txt
          total_pages=$(pdfinfo /tmp/geography.pdf | awk '/^Pages:/ {print $2}')
          if [ -z "$total_pages" ] || [ "$total_pages" -lt 218 ]; then echo "::error::Book PDF has fewer than 218 pages"; exit 1; fi
          for page in $(seq 195 220); do
            pdftoppm -f "$page" -l "$page" -singlefile -scale-to 1500 -png /tmp/geography.pdf "assets/geography-maps/page-$page"
          done
          test -s assets/geography-maps/page-203.png
      - name: Crop only the original maps with titles and legends
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          # Crop rectangles were inspected against the actual original textbook pages.
          # Page 218 contains exercises but NO map, so it is not cropped as a map.
          rectangles = {
              198: (0.128, 0.335, 0.875, 0.797),
              203: (0.102, 0.238, 0.897, 0.790),
              209: (0.143, 0.212, 0.882, 0.621),
              211: (0.099, 0.084, 0.568, 0.402),
          }
          for page, (left, top, right, bottom) in rectangles.items():
              source = Path(f"assets/geography-maps/page-{page}.png")
              with Image.open(source) as im:
                  w, h = im.size
                  cropped = im.crop((round(w*left), round(h*top), round(w*right), round(h*bottom)))
                  destination = Path(f"assets/geography-maps/map-{page}.png")
                  cropped.save(destination, optimize=True)
                  print(f"{destination}: {cropped.size}")
          PY
      - name: Create compact overview of other textbook pages
        shell: bash
        run: |
          mkdir -p assets/geography-maps/overviews
          total_pages=$(pdfinfo /tmp/geography.pdf | awk '/^Pages:/ {print $2}')
          for start in 1 41 81 121 161 221 261; do
            end=$((start+39))
            if [ "$end" -gt "$total_pages" ]; then end="$total_pages"; fi
            mkdir -p "/tmp/overview-$start"
            for page in $(seq "$start" 2 "$end"); do
              pdftoppm -f "$page" -l "$page" -singlefile -scale-to 420 -jpeg -jpegopt quality=55 /tmp/geography.pdf "/tmp/overview-$start/$page"
            done
            /usr/bin/python3 - "$start" <<'PY'
          import sys
          from PIL import Image, ImageDraw
          from pathlib import Path
          start=int(sys.argv[1])
          folder=Path(f"/tmp/overview-{start}")
          images=sorted(folder.glob("*.jpg"),key=lambda p:int(p.stem))
          out=Image.new("RGB",(5*170,4*275),"white")
          d=ImageDraw.Draw(out)
          for i,p in enumerate(images[:20]):
              with Image.open(p) as im:
                  im.thumbnail((165,245))
                  x=(i%5)*170+(170-im.width)//2
                  y=(i//5)*275
                  out.paste(im,(x,y))
              d.text(((i%5)*170+4,y+248),f"PDF {p.stem}",fill="black")
          out.save(f"assets/geography-maps/overviews/pages-{start}.jpg",quality=65)
          PY
          done
      - name: Commit original map pages into website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/geography-maps/page-*.png assets/geography-maps/map-*.png assets/geography-maps/overviews/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add original geography textbook page images'
            # Rebase onto changes pushed by other workflows before publishing generated images.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::Could not push extracted maps after retries'
          exit 1
          fi
