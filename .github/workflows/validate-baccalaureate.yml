name: Validate baccalaureate modules
on:
  push:
    paths:
      - 'books-repair.js'
      - 'data/bac-sci-release-assets.json'
      - 'data/bac-sci-extracted/**'
      - 'tests/bac-sci.test.cjs'
      - 'study.js'
      - 'lesson-index.js'
      - 'verified-toc.js'
      - 'scripts/validate-baccalaureate.cjs'
      - '.github/workflows/validate-baccalaureate.yml'
  workflow_dispatch:
jobs:
  validate-baccalaureate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scientific and literary modules
        run: |
          node scripts/validate-baccalaureate.cjs
          node --test tests/bac-sci.test.cjs
