name: Build Abu Shreek Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate launcher icon from SVG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root=Path('android-app/app/src/main/res')
          src='android-app/app-icon.svg'
          for folder,size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              dest=root/folder/'ic_launcher.png'
              dest.parent.mkdir(parents=True,exist_ok=True)
              cairosvg.svg2png(url=src,write_to=str(dest),output_width=size,output_height=size)
          PY
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Abu-Shreek-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as public prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Abu Shreek Android Preview
          prerelease: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
