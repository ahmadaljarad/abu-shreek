name: Validate grade 9 indexes
on:
  push:
    paths:
      - 'verified-toc.js'
      - 'scripts/validate-grade9.cjs'
      - '.github/workflows/validate-grade9.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grade 9 index integrity
        run: node scripts/validate-grade9.cjs
